# Stage 5 for this repo. Not the shipped template: these are the checks that
# actually matter for a plugin published publicly and installed by other people.
version: 1

policy:
  empty_run: refuse
  # This repo's own checks live in this repo, and this repo is the one being
  # checked. Saying so explicitly is the point: a cloned repo that has NOT been
  # trusted cannot run its own tooling.
  allow_repo_local_tools: true
  output: .claude/productizer/checks-result.json
  # MEASURE THE SPEC, DO NOT REFUSE ON IT YET. `auto` has no middle: the first
  # coverage claim anyone declares turns enforcement on for the WHOLE spec, so
  # recording the first four honest claims took this repo from green to refusing
  # every run - punishing exactly the act it is meant to encourage.
  #
  # This is not a way to stop counting. The denominator still comes from the
  # spec, every uncovered requirement is still named in the output, and the line
  # reads "declared but not enforced" so nobody mistakes the run for clean
  # coverage. It is a committed, visible statement that the mapping is
  # unfinished. Turning this to `require` is the last step of B28, and it is
  # deliberately the LAST step: flipping it before the other 21 requirements are
  # mapped refuses every run and teaches everyone to ignore the stage.
  spec_coverage: report

defaults:
  timeout_seconds: 180
  mode: batch
  severity: block

checks:

  # --- repo hygiene --------------------------------------------------------
  - id: hygiene
    why: this repo is public and installed by strangers; an employer name, a private repo name or a credential in it cannot be unpublished
    when:
      always: true
    severity: block
    requires: [./scripts/check-hygiene.sh]
    version_command: [./scripts/check-hygiene.sh, --version]
    mode: batch
    command: [./scripts/check-hygiene.sh, "{files}"]
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: all_triggering
      min_covered: 1

  # --- shell linting -------------------------------------------------------
    limitations:
      - It sees only the files handed to it. Git history, commit messages and release bodies are outside its reach, and every one of those has leaked here and had to be swept by hand.
      - The private half of the deny list is loaded at runtime and is absent in CI and in a fresh clone, so those runs check generic rules only. The run says so rather than staying quiet.

  - id: shell-lint
    why: these scripts run on other people's machines, and an unquoted expansion there is their problem, not ours
    when:
      paths: ["**/*.sh"]
    severity: block
    requires: [shellcheck]
    version_command: [shellcheck, --version]
    mode: per_file
    command: [shellcheck, --severity=warning, --format=gcc, "{file}"]
    timeout_seconds: 600
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2, 3, 4]
    coverage:
      from: per_file_exit
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1

  # --- the solver's own corpus --------------------------------------------
    limitations:
      - Runs at --severity=warning, which does NOT include SC2086, unquoted expansions. That was found when a deliberate SC2086 failed to turn the gate red.

  - id: solver-corpus
    why: precision must stay at 1.00 - a contradiction checker that halts on a non-conflict gets switched off, and then nothing is checked
    # Was `paths: ["**/contradiction-check.py"]`, so it only ran when the
    # solver's own source changed and reported `not_triggered` on every other
    # commit. A check with no evidence is not a passing check, and this is the
    # one whose `why` says precision must stay at 1.00 - the property most
    # worth knowing on every run, not only when someone edits the file that
    # provides it. It is a 0.3s stdlib self-test with no external dependency,
    # so `always` costs nothing and buys evidence on every commit.
    when:
      always: true
    severity: block
    requires: [python3]
    version_command: [python3, --version]
    mode: batch
    command: [python3, plugins/productizer/skills/spec/scripts/contradiction-check.py, --selftest]
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      from: stdout_count
      pattern: 'true positives[^0-9]*([0-9]+)'
      min_covered: 1

  # --- suppressed stderr ---------------------------------------------------
  #
  # Discarding stderr makes an ERROR and a genuine NO-MATCH identical, and once
  # they are identical the run is green either way. In one session that cost
  # three real defects in this repo: a count that was wrong, an absence that
  # was not an absence, and a check that examined nothing and passed.
  #
  # ADVISE, NOT BLOCK, AND THIS IS DELIBERATE. The first run found 66
  # occurrences across 8 of the 28 shell scripts here - not the 13 anyone
  # expected. Blocking on day one would have been an argument about the rule
  # instead of a list of the debt, and a rule people argue with gets deleted.
  # Advisory reports every one of them into the review brief and blocks
  # nothing.
  #
  # PROMOTE IT TO `block` when the advisory count reaches zero - that is,
  # when every remaining occurrence has either been removed or carries a
  # written reason. The count is printed on every run, so there is no
  # judgement call about when that day arrives. An advisory check nobody ever
  # promotes is a check nobody reads.
  #
  # THE FOUR EXEMPTIONS BELOW ARE THE WHOLE POINT OF THE MECHANISM. Each names
  # a file, quotes the exact redirection, and states why in a sentence a
  # reviewer can disagree with in this diff. An entry that quotes no
  # redirection, or gives no reason, is REFUSED - not honoured, and not
  # downgraded to a finding. A check that can be silenced without saying why is
  # the thing this check exists to prevent.
  #
  # Code you can edit does not need an entry here: put `# stderr-ok: <reason>`
  # on the offending line instead. Same rule, same minimum, next to the code.
    limitations:
      - It is a second opinion on numeric bounds and mutually exclusive responses. Its CONSISTENT means not decided, never cleared.
      - Recall was 0.70 on the corpus written first and 0.12 on a harder one, so the figure tracked the corpus rather than the checker.

  - id: stderr-suppression
    why: an error and a genuine no-match look identical once stderr is discarded, and this repo has already shipped three defects that hid in exactly that gap
    when:
      paths:
        - "**/*.sh"
        - "**/*.bash"
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-stderr.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-stderr.sh, --version]
    mode: per_file
    command:
      - ./plugins/productizer/skills/spec/scripts/check-stderr.sh
      - --allow
      - 'plugins/productizer/skills/spec/scripts/build-view.sh::2>/dev/null || :::the view builder runs against a repo that may have no history, no tags and no remote; every one of these lines already turns a failure into no data with || : , and git writes a fatal to stderr for the empty case, which is expected and not an error'
      - --allow
      - 'plugins/productizer/skills/spec/scripts/build-view.sh::--git-dir >/dev/null 2>&1::an existence probe for a git work tree, the same shape as command -v; the answer is the exit status and the only thing on stderr is git saying this is not a repository'
      - --allow
      - 'plugins/productizer/skills/spec/scripts/run-checks.sh::$pid" 2>/dev/null::kill and wait address a pid this script started and owns; the only stderr is ESRCH from a child that already exited, which is the ordinary case this loop is written around'
      - --allow
      - 'plugins/productizer/skills/spec/scripts/run-checks.sh::git merge-base "$BASE" HEAD 2>/dev/null::the very next line refuses the whole run and names the base that could not be resolved, so the failure is reported rather than lost - the cost is that git own wording goes with it'
      - "{file}"
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # suppressed stderr found
      refused: [2]     # a file it could not read, or an exemption with no reason
    coverage:
      from: per_file_exit
      # 0 = clean, 1 = findings. Both mean the file was read end to end. A 2 is
      # a file it bounced off or an exemption it would not honour, and neither
      # is a file it checked.
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1

  # --- one living spec per product ----------------------------------------
  #
  # R1 says the lifecycle shall hold exactly one living spec per product. Until
  # this check existed nothing asserted it: `product.spec_home` was declared in
  # config.json and never read back, so a second `.claude/productizer/spec.md`
  # in a second repo would have gone unnoticed - two allocators both handing
  # out R42, and the divergence found later by whoever trusted the wrong one.
  #
  # `always`, because the failure it catches does not arrive in a diff. A repo
  # is added to the product, or someone scaffolds a spec in the wrong place,
  # and no file in THIS repo changes.
  #
  # UNREACHABLE IS NOT ABSENT. A repo the check cannot open exits 2 - refused -
  # and is never counted as "no spec there". Counting it as absent is how a
  # two-spec product reports as a one-spec product.
    limitations:
      - Fourteen suppressions remain, exempted by allowlist entries with written reasons. Three rest on a measured SIGPIPE from a deliberate cap, and they exempt the whole line - a genuine error on it would still be hidden.

  - id: spec-home
    why: two repos both holding a living spec means two allocators both handing out R42, and nothing in this lifecycle noticed until now
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-spec-home.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-spec-home.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-spec-home.sh, --config, .claude/productizer/config.json]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # too many specs, none, or not where the config says
      refused: [2]     # a repo out of reach, or a config that cannot be read
    coverage:
      # The check's own count of repos it actually reached. A run that reached
      # none prints 0 here and fails coverage as well as exiting 2 - a spec
      # count nobody could compute is not a spec count of zero.
      from: stdout_count
      pattern: 'repos reachable:\s*([0-9]+)'
      min_covered: 1

  # --- a halt that nobody was asked to answer --------------------------------
  #
  # R23 says the lifecycle shall stop and ask which wins. The acceptance row for
  # it asserted the STOP and not the ASK, and the two are not the same event:
  # the halt worked, no ruling was ever drafted, and the work stopped and stayed
  # stopped with nobody holding a question. This check observes the ask.
  #
  # It asserts the obligation, not the implementation. The cautionary case in
  # this repo is R18, whose row says `argv[0] validation` while the principle it
  # enforces requires the whole argv - a row that describes what the code does
  # can never fail.
  #
  # `always`, because the failure does not arrive in a diff. A contradiction is
  # raised in conversation and abandoned; no file changes, which is precisely
  # the problem.
  #
  # UNREADABLE IS NOT ABSENT. A rulings directory nobody can open exits 2, never
  # 0 - a directory nobody can open is exactly where an unasked question hides.
    limitations:
      - A repo it cannot open is refused, never counted as having no spec. But a product whose repos are not all declared is invisible to it entirely.

  - id: ruling-requested
    why: a contradiction that halted without a drafted ruling leaves nobody holding the question, and the spec shows nothing waiting
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-ruling-requested.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-ruling-requested.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-ruling-requested.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # a concern with no ruling, a ruling nothing cites, or a ruling still wearing the template
      refused: [2]     # the rulings directory or one of its files could not be read
    coverage:
      # Files the check actually opened, one per line. The spec is always one of
      # them, so a run that opened nothing is a bug rather than an empty repo.
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 1

  # --- agent templates carry frontmatter nothing reads ------------------------
  #
  # Declared checks covered all files (hygiene), `**/*.sh` and the solver corpus.
  # The agent templates carry YAML frontmatter that selects a model, a tool set
  # and a permission mode - and nothing validated it. A typo in a key name does
  # not fail loudly; it silently falls back to a default, so a template that
  # asked for a restricted tool set quietly gets the unrestricted one.
  #
  # `always`, because the failure does not arrive in a diff: a key stops being
  # honoured when the host changes, not when the template does.
    limitations:
      - It observes that a ruling was drafted, not that the question was good. A ruling can pass every field check and still ask something nobody can answer.
      - A contradiction stopped in conversation with nothing written leaves it nothing to find.

  - id: template-frontmatter
    why: a mistyped frontmatter key does not fail, it falls back to a default, so a template that asked for a restricted tool set silently gets the unrestricted one
    when:
      always: true
    severity: block
    requires: [python3]
    version_command: [python3, ./plugins/productizer/skills/spec/scripts/check-frontmatter.py, --version]
    mode: batch
    command: [python3, ./plugins/productizer/skills/spec/scripts/check-frontmatter.py]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # frontmatter that will not do what it says
      refused: [2]     # bad invocation, or a template that could not be read
    coverage:
      # The check's own count of files it opened. A file nobody could read is
      # counted as could-not-run, never as a file that passed.
      from: stdout_count
      pattern: '([0-9]+) file\(s\) checked'
      min_covered: 1

  # --- the guide the release ships with ---------------------------------------
  #
  # R9 says the lifecycle shall regenerate the user guide from the active
  # requirements when a release is prepared. Nothing did, and it was not a
  # theoretical gap: v4.8.0 and v4.8.1 both shipped from a hand-edited GUIDE.md.
  #
  # `--check` REGENERATES INTO MEMORY AND WRITES NOTHING, which is the only way
  # a check may touch a file somebody edits. A check that quietly fixed the
  # guide would report a pass on a release nobody had read the guide for.
  #
  # `always`, deliberately not a path trigger. Drift does arrive in a diff of
  # either file, but a paths trigger reports `not_triggered` on every other
  # commit, and this is the one fact worth knowing on the commit where a release
  # is cut. It reads two files in under a tenth of a second.
  #
  # AN UNREADABLE SPEC IS 3, NOT 0. A guide generated from a spec nobody could
  # open would describe a product nobody agreed to, so it refuses to render a
  # count it could not measure - and refused is not a pass.
    limitations:
      - It checks the frontmatter of the agent templates only. A key the host silently ignores still reads as valid here.

  - id: guide-current
    why: two releases shipped from a hand-edited guide, and a guide describing behaviour the spec never agreed to reads exactly like one that does
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/build-guide.sh
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/build-guide.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/build-guide.sh, --check]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # the committed guide is out of date with the spec
      refused: [2, 3]  # no markers to write between, or a spec that could not be read
    coverage:
      # The script's own count of active requirements it rendered. A run that
      # rendered none never prints this line - it exits 3 - so a zero here is
      # impossible rather than merely unlikely.
      from: stdout_count
      pattern: '([0-9]+) active requirement\(s\) rendered'
      min_covered: 1

  # --- a view that writes back, or a page that can republish itself ---------
  #
  # R4 says every published view shall be read-only WITH RESPECT TO THE SPEC.
  # That is two obligations failing in different places, so one check asserts
  # both: the generator writes nothing into the tree (every file hashed before
  # and after, content AND mtime, generating into a temporary --out), and the
  # page it produces declares no capability that can publish a new version of
  # itself. `downloads` is output and passes. A capability name this check
  # cannot classify also fails, because an unrecognised capability has not been
  # shown to be output-only - failing safe is the point.
  #
  # `always`, because neither failure arrives in a diff: the page's capability
  # is decided by the generator, and a stray write can come from anything it
  # calls.
  #
  # A PAGE THAT COULD NOT BE BUILT IS EXIT 2, never "0 capabilities declared".
    limitations:
      - It compares the generated section against the spec. The hand-written prose around it can say anything, and nothing checks that.

  - id: view-read-only
    why: a view that writes into the repo, or a page that can save new versions of itself, makes the provenance line under every panel false - the page becomes a second source of truth that can disagree with the repo
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-view-readonly.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-view-readonly.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-view-readonly.sh]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]        # a repository file moved, or the page declared something it may not
      refused: [2]     # no work tree, no builder, or a page that could not be generated
    coverage:
      # One bare path per repository file hashed. `must_cover: none` and NOT
      # all_triggering, deliberately: this examines the whole tree rather than
      # the change, so a commit that DELETES a file would name a path that no
      # longer exists and the check would be called hollow for being right. The
      # real hollowness guard is inside the check - an empty file list is exit 2.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 1

  # --- an absent tool must be reported missing, not skipped -----------------
  #
  # R13. The behaviour lives in run-checks.sh and was demonstrated by hand; a
  # demonstration is not a test. Nothing stopped a refactor turning
  # `missing_tool` back into a skip while every run stayed green, because a
  # skipped check is invisible: no finding, no failure, no line anyone reads.
  #
  # Six things are asserted separately, and the last one is the one that
  # matters: that it counts as a blocking failure with verdict `refused`. A
  # status written into a file that does not change the verdict is a skip
  # wearing a different name.
  #
  # The fixture's own premise is guarded: if its declared tool turns out to be
  # installed, the case was never tested and that is exit 2 - unmeasured, not a
  # pass.
    limitations:
      - It reads what the page ASKS for. A capability granted in the publish call and never used by the page leaves no trace in the file.
      - The forbidden-name list comes from the reference doc, not the live runtime roster. An unrecognised name fails safe, but the classification is unverified.
      - The two hashes bracket the generator's run, so anything else writing to the tree in that window is attributed to it.

  - id: missing-tool-reported
    why: a check whose tool is absent has to refuse the stage, and a refactor turning that back into a skip would leave every run green with no scanner behind it
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-missing-tool.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-missing-tool.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-missing-tool.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # an absent tool is no longer reported the way R13 requires
      refused: [2]     # no fixture, no runner, or the fixture's tool turned out to be installed
    coverage:
      # The three files it opened: the runner under test and the two fixture
      # files. A run that printed fewer opened fewer, and did not run the case.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 3

  # --- a requirement nobody said how to prove ---------------------------------
  #
  # R8 says the lifecycle shall allocate the next unused id AND RECORD IT IN THE
  # ACCEPTANCE CRITERIA TABLE. `validate-spec.py` owns the id half. Nothing owned
  # the other clause, and its failure is silent: a requirement lands, gets cited
  # by a plan, a branch and a PR title, and never acquires a row saying what
  # would prove it.
  #
  # A ROW IS NOT DEMANDED OF SUPERSEDED, WITHDRAWN OR INFERRED REQUIREMENTS. The
  # first two are frozen records. The third is references/import.md:70, which
  # says an inferred requirement gets no row precisely because this comparison is
  # what answers "do the tests assert the criteria". Demanding one is not a
  # stricter check, it is a wrong one that goes permanently red against a correct
  # spec.
  #
  # `always`, because the failure does not arrive in a diff: a row goes missing
  # when a requirement is added elsewhere in the file, not when the acceptance
  # table is edited. The table is the thing that did NOT change.
  #
  # MEASURED 2026-08-30: 25 active, 25 rows, 0 missing - so it lands blocking
  # rather than advisory. The count prints on every run, so if it ever has to
  # drop to `advise`, the day to promote it back is not a judgement call.
    limitations:
      - It exercises batch mode and the PATH-lookup branch. The executable-path branch and per_file mode are untested.

  - id: acceptance-rows
    why: a requirement with no acceptance row is one nobody can tell "verified" from "never looked at" for, and every plan and PR citing its id inherits that
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-acceptance-rows.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-acceptance-rows.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-acceptance-rows.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # an active requirement with no row, named by id and line
      refused: [2]     # a spec that could not be read or could not be parsed
    coverage:
      # Every requirement PARSED, not the subset that produced findings.
      # "0 missing rows" is only a claim about a spec somebody actually parsed.
      from: stdout_count
      pattern: 'requirements read:\s*([0-9]+)'
      min_covered: 1

  # --- an import that reads as agreed -----------------------------------------
  #
  # R10. `build-view.sh` RENDERS the inferred status and nothing asserted it was
  # ever applied - the view's own comment calls an unmarked import "the precise
  # failure the inferred status exists to prevent". Unmarked, the audit trail
  # records a decision nobody made, and the Stage 2 halt starts defending an
  # imported accident with the authority of a ratification.
  #
  # THERE IS NO RELIABLE SIGNAL THAT AN IMPORT HAPPENED, AND THE CHECK SAYS SO ON
  # EVERY RUN. Stage 0c writes no artifact and sets no config key. The obvious
  # signal - the word "import" in a commit message - was built and MEASURED
  # FIRST, and attributed six requirements to an import in a fixture where four
  # were agreed one at a time. On THIS repo that is not hypothetical: it is a
  # lifecycle tool WITH an import stage, so a requirement about importing carries
  # the word while having nothing to do with a Stage 0c run. A check that fails
  # on a correct spec gets switched off.
  #
  # So detection is structural: a spec holding an inferred requirement is a spec
  # an import touched. From each MARKED requirement it reaches the batch - the
  # change-log row naming it, and the commit that INTRODUCED it, oldest first so
  # a later reflow is not read as the import - and demands the marking of every
  # sibling. `Stage 0c` is the one piece of prose trusted, being a stage
  # identifier rather than an English word.
  #
  # THE HOLE, STATED: an import that marked NOTHING and named no stage is
  # invisible here, because both structural cohorts start from a marker. The run
  # prints all three cohort tallies and says in words that no import was FOUND,
  # which is not the same fact as an import having been marked correctly.
  # Closing it needs an artifact Stage 0c does not write.
  #
  # GIT IS PART OF THE INPUT. A history that cannot be walked is exit 2 with that
  # cohort printed as an em dash - never as 0 commits.
    limitations:
      - It asserts a row EXISTS, never that the row is true. A row saying nothing asserts this satisfies it exactly as well as a real verifier.

  - id: import-marking
    why: a drafted requirement that lost its inferred marker reads as agreed, so the contradiction halt starts defending an imported accident with the authority of a decision nobody made
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-import-marking.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-import-marking.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-import-marking.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a requirement attributed to an import with no marking
      refused: [2]     # an unparseable spec, or a git history that could not be walked
    coverage:
      # Every requirement PARSED. Deliberately NOT the attribution count, which
      # is legitimately 0 on a repo that was never imported and would make every
      # honest run read as hollow.
      from: stdout_count
      pattern: 'requirements read:\s*([0-9]+)'
      min_covered: 1

  # --- a classification nobody can check ------------------------------------
  #
  # R6 says an intent is classified against the WHOLE living spec. A graded eval
  # scored 16/16 on OUTCOMES, which is equally consistent with a classifier that
  # read all 25 active requirements and one that read the first eight and got
  # lucky on a small spec. Outcomes cannot separate those, and the gap widens
  # with every requirement added. What separates them is the list of ids that
  # were actually in front of it.
  #
  # R19 says an unreachable spec home is a stop, not a classification against a
  # remembered copy. Written as a rule it is enforced by whoever remembers it.
  # Written as a hash it is enforced by arithmetic: no readable spec home means
  # no hash, the writer refuses to emit a record without one and creates nothing,
  # and this check refuses a record that has none. Classifying from a remembered
  # copy stops being forbidden and becomes impossible to RECORD.
  #
  # THE ONE PLACE AN EM DASH IS REFUSED. Everywhere else in this lifecycle an
  # unmeasured value is an em dash. Here the correct answer to an unreachable
  # spec is NO RECORD, so a record that honestly writes the gap in is a
  # classification that should never have happened wearing the paperwork of one
  # that did.
  #
  # A RECORD MADE AGAINST AN OLDER SPEC IS NOT A FINDING. The comparison is
  # anchored to the commit the record cites, not to the spec today. The normal
  # intake flow is classify, then merge the delta - so anchoring to today would
  # take this red on every historical record the first time a requirement was
  # added, and a check that is always red gets deleted.
  #
  # `always`, because the failure does not arrive in a diff: an intent is
  # classified against half a spec and nothing in the repo changes.
    limitations:
      - An import that marked nothing at all and named no stage is invisible: both structural cohorts start from a marker. The run says no import was FOUND, which is not the same fact as an import having been marked correctly. Closing this needs an artifact Stage 0c does not write.

  - id: classification-provenance
    why: a graded eval scored 16/16 on classification OUTCOMES, which is equally consistent with a classifier that saw half the spec and got lucky; only the ids that were in scope tell those apart
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-classification-provenance.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-classification-provenance.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-classification-provenance.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]        # every record stands up, or there are none and it says so
      fail: [1]        # a truncated scope list, a hash that does not match, a missing or placeholder hash, two records for one intent, or a fifth classification value
      refused: [2]     # no work tree, no spec, an unreadable store or record, or a recorded commit this clone cannot resolve
    coverage:
      # Files actually opened, one per line. The spec is always one of them, so
      # a run that opened nothing is a bug rather than a repo with no records.
      # `must_cover` omitted deliberately: an `always` check taking no {files},
      # the same shape as ruling-requested.
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 1

  # --- a replaced requirement rewritten years later --------------------------
  #
  # R3's marking half is readable in the file in front of you. Its TEXT half is
  # not readable there at all: the spec always says whatever it currently says,
  # and a superseded requirement whose sentence was quietly rewritten looks
  # exactly like one nobody touched. The original survives only in git.
  #
  # This is the first check here to take GIT HISTORY as an input, and it reads
  # what a commit USED TO SAY rather than what a commit changed. A diff-only
  # gate sees an edit at the moment it is proposed and never again - which is
  # how both of this repo's real leaks survived: one in a blob, one in a commit
  # message, neither visible to any diff after the commit that made it.
  #
  # The baseline is chosen PER REQUIREMENT: the newest commit at which that
  # requirement was still active. One ref cannot be that commit for every id,
  # which is why validate-spec.py --baseline cannot answer R3.
  #
  # `always`. The edit that matters was merged some commits ago and is, to
  # every diff since, simply the agreed text.
  #
  # min_covered: 2 is deliberate. One covered path means the spec was read and
  # NO history was - precisely the run that answers nothing while exiting 0.
    limitations:
      - A classification that left no record at all is invisible. Zero recorded is not detectable as an intake that classified in conversation and wrote nothing.
      - It proves the scope list matches the spec it names. That the named commit is the RIGHT one is established by the writer, not by this.

  - id: superseded-text
    why: a superseded requirement's sentence can be rewritten long after the fact and nothing in the file shows it; only the commit before the supersede holds what was agreed
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-superseded-text.sh
      - ./plugins/productizer/skills/spec/scripts/spec-requirements.sh
      - git
    version_command: [./plugins/productizer/skills/spec/scripts/check-superseded-text.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-superseded-text.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # text altered, marker removed, or a pointer to nothing
      refused: [2]     # a shallow clone, an untracked spec, a spec with no requirements
    coverage:
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 2

  # --- a spec change merged under a live contradiction ------------------------
  #
  # R12. The load-bearing word is DEPENDS. references/rulings.md: "A pending
  # ruling blocks its own delta and nothing else. Unrelated intents keep
  # flowing." A check refusing every spec change while any ruling is pending
  # would enforce the opposite of R12 while passing for it - and would fail
  # slowly, by teaching people to stop routing work through intake at all.
  #
  # Scope is derived from the ruling itself: the requirement quoted in its
  # `## The conflict` section, plus the ids in the concern row citing it.
  # Everything else is REPORTED as allocated and let through, on its own line,
  # so the decision not to block is visible rather than silent.
  #
  # `always`, because the window a pending ruling holds open starts at the
  # commit that raised it - older than whatever is under review now - and a
  # ruling raised in a different PR governs this one.
  #
  # UNREADABLE IS NOT ABSENT. No rulings directory is clean and says so: R12
  # governs a state this repo has never entered. A rulings directory that
  # exists and cannot be listed is exit 2 - that is where an unruled
  # contradiction hides.
    limitations:
      - A requirement that ENTERS the repo already superseded and already rewritten cannot be caught: its first commit is the only baseline there is.
      - A shallow clone is refused rather than passed, which means CI must fetch full history for this to measure anything.

  - id: pending-ruling-scope
    why: a pending ruling that blocks nothing is a stop nobody obeys, and one that blocks everything is a stop everybody routes around
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-pending-ruling-scope.sh
      - ./plugins/productizer/skills/spec/scripts/spec-requirements.sh
      - git
    version_command: [./plugins/productizer/skills/spec/scripts/check-pending-ruling-scope.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-pending-ruling-scope.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a spec change depending on an unruled contradiction
      refused: [2]     # a ruling that cannot be scoped, or a window out of reach
    coverage:
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 1
    limitations:
      - The incoming behaviour merged under a sentence with a different EARS trigger than the contested requirement is not recognised. Closing it needs a similarity threshold, which starts refusing unrelated intents - the failure rulings.md names.

  # --- R27 and R28: measure the precondition, do not claim the behaviour ----
  #
  # Both are EARS optional-feature clauses guarded on a backlog item naming a
  # Jira key. Nothing here does: `jira` is null in the config - the recorded
  # "GitHub only" answer - and no backlog row carries a key. So the obligation
  # is not unimplemented, it is UNREACHABLE, and the honest verdict is `n/a`.
  #
  # The n/a is not an excuse with a reason bolted on. It is bound to a
  # measurement that reruns every time: the runner voids a coverage claim from
  # a check that failed, so the instant Jira is bound or a key appears, this
  # check fails, both claims void, R27 and R28 return to `Missing`, and the
  # suite refuses. The n/a expires by itself. Nobody has to remember it.
  #
  # Building the integration instead stays a backlog item, which is the
  # decision that was actually made. This declares what is true today, and
  # arranges to stop being true on its own.
  - id: jira-unbound
    why: an n/a nobody can expire is an excuse; this one is re-measured from the two files that decide it, every run
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-jira-unbound.sh
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/check-jira-unbound.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-jira-unbound.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # Jira is bound, or a backlog row names something key-shaped
      refused: [2]     # config or backlog absent or unreadable - the precondition is UNKNOWN, which is not shut
    coverage:
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 1
      spec_units:
        - id: R27
          verdict: n/a
          reason: >-
            No backlog item names a Jira key and `jira` is null in the config, so the
            "Where a backlog item names a Jira key" guard never opens in this repository.
            This is measured from both files on every run, not asserted once: bind Jira or
            write a key into the backlog and this check fails, which voids this claim and
            puts R27 back to Missing.
          evidence: .claude/productizer/config.json and .claude/productizer/backlog.md, read each run
        - id: R28
          verdict: n/a
          reason: >-
            Same guard as R27, same measurement. With no Jira binding and no key in the
            backlog there is no Jira for the lifecycle to write back to, so the obligation
            not to write is unreachable rather than unimplemented. It returns to Missing the
            moment the guard can open.
          evidence: .claude/productizer/config.json and .claude/productizer/backlog.md, read each run
    limitations:
      - It measures that the guard is SHUT. It says nothing whatever about what the lifecycle would do if it were open, because nothing here reads or writes Jira at all.
      - The key pattern has no exclusion list, so a token like `UTF-8` in the backlog will fail this check. That is the intended direction to be wrong in - a false positive costs five minutes, a false negative leaves two requirements in an n/a nobody notices.

  # --- an unmeasured value must not be recorded as zero ---------------------
  #
  # R26, and P1's first sentence. Its pair R25 - report it as unmeasured - is
  # already asserted, and the two are not the same claim. A run can print
  # `spec coverage: UNMEASURED` on the terminal and, in the same breath, write
  # `units_total: 0` into the result file every downstream reader parses: R25
  # passes on that run and R26 fails on it. That state was CONSTRUCTED from
  # this runner, not argued for - the printed line is keyed on the status and
  # the recorded values are not, so the two live in different code paths.
  #
  # So this check reads THE RESULT FILE and never the printed line. It drives
  # `fixtures/fabricated-zero/` through run-checks.sh, which makes two values
  # unmeasurable at once because the runner records them in two shapes: the
  # coverage denominator (spec file absent, so the fields must be NULL) and one
  # check's own coverage (declared tool absent, so the block must be ABSENT).
  # Absent, null and zero are three states and collapsing them is the defect;
  # each field is classified into one of them and the classification prints, so
  # a failure says which state the field is in.
  #
  # Both premises are guarded. If the tool turns out to be installed, or the
  # spec path turns out to exist, nothing was unmeasurable and R26 was never
  # exercised - exit 2, unmeasured, never a pass.
  - id: no-fabricated-zero
    why: a fabricated zero is the only failure here that is invisible - a month later it reads exactly like a real zero, and nobody can tell which they are looking at
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-no-fabricated-zero.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-no-fabricated-zero.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-no-fabricated-zero.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]
      fail: [1]        # a value nobody could measure is recorded as zero
      refused: [2]     # no fixture, no runner, an unreadable result, or a premise that did not hold
    coverage:
      # The three files it opened: the runner under test and the two fixture
      # files. A run that printed fewer opened fewer, and did not run the case.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 3
      spec_units:
        - id: R26
          verdict: Covered
          evidence: fixtures/fabricated-zero/ driven through run-checks.sh; seven assertions on the recorded result, falsified three ways
    limitations:
      - It names six fields plus a sweep over cannot-run rows. A zero fabricated into a seventh field would not be caught; a blanket "no 0 anywhere" would go red on real counts like `passed: 0`.
      - Two of P1's four sources are exercised - an absent tool and an unreadable file. A failed API call and a refused permission are not reached by any fixture.
      - The runner's `timeout` path builds a coverage block with `covered` initialised to 0 while the status means no verdict. Assertion 7 would flag it, but no timeout fixture exists, so that is unmeasured and is backlog item B29.
      - It covers run-checks.sh only. P1 also names import-survey.sh, build-view.sh and track-traffic.sh, and none of those is touched here.

  # --- a contradiction must merge nothing -----------------------------------
  #
  # R24. R23's pair - stop, and ask - is asserted by two checks, and NEITHER
  # looks at the spec afterwards. A contradiction that halted loudly and merged
  # quietly passes every other check in this file. This one drives a committed
  # fixture through the real contradiction path and then compares the spec.
  #
  # LITERAL WHOLE-FILE IDENTITY IS NOT THE TEST, and demanding it would fail
  # correct behaviour. The stop is REQUIRED to append an `Areas of concern`
  # row - step 3 of references/rulings.md, and `ruling-requested` goes red
  # without it. So assertion 1 hashes the spec with that section excised, and
  # every other byte must match. That leaves one blind region, which is why
  # assertion 2 also requires every id inside that section to name a
  # requirement that existed before the run: an id taken there is a merge, and
  # the excision would otherwise hide it. That gap was found by falsifying, not
  # by reading - the first version of this check went green on it.
  #
  # Four assertions, reported separately: the spec is unchanged, no id was
  # allocated, the change log gained no row, the acceptance table gained no
  # row. A contradiction that quietly took the next id has merged the losing
  # side even if no sentence changed, and the counter moving is the tell.
  #
  # The premise is guarded at both ends. If the fixture's intent does not
  # actually contradict, the case was never tested - exit 2. If the merge path
  # exits non-zero, it never ran to completion, and a spec left untouched by an
  # ERROR is not a spec the lifecycle declined to merge - also exit 2.
  - id: nothing-merged
    why: R23's two checks assert the stop and neither looks at the spec afterwards, so a contradiction that halted loudly and merged quietly passes every check in this file
    when:
      always: true
    severity: block
    requires:
      - ./plugins/productizer/skills/spec/scripts/check-nothing-merged.sh
      - python3
    version_command: [./plugins/productizer/skills/spec/scripts/check-nothing-merged.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-nothing-merged.sh]
    timeout_seconds: 120
    exit_codes:
      pass: [0]        # the contradiction path merged nothing
      fail: [1]        # the spec moved, an id was taken, or a log row appeared
      refused: [2]     # no fixture, no contradiction checker, a premise that did not hold, or a merge path that never ran
    coverage:
      # The four files it opened: both fixture files, the checker that settles
      # the premise, and the merge path it drove. A run that printed fewer
      # opened fewer, and did not run the case.
      from: stdout_paths
      pattern: '^(\S+)$'
      must_cover: none
      min_covered: 4
      spec_units:
        - id: R24
          verdict: Covered
          evidence: fixtures/nothing-merged/ driven through request-ruling.sh; four assertions on the spec afterwards, each falsified separately
    limitations:
      - It proves the CONTRADICTION PATH merges nothing. `request-ruling.sh` is the only script under skills/spec/scripts that writes spec.md - a grep result, not a guarantee, and a second writer added later is invisible to this.
      - Prose written into `## Areas of concern` is not seen. Assertion 1 excises that section and assertion 2 catches only ids taken inside it.
      - >-
          The `record-classification.sh` path is not exercised; it needs a work tree with the spec
          committed at HEAD. "Recording a contradict classification merges nothing" is therefore unasserted.
      - A file the merge path CREATES elsewhere in the sandbox is not noticed. The comparison is scoped to the spec, which is what R24 is about, but a merge that landed somewhere else entirely would not show here.
