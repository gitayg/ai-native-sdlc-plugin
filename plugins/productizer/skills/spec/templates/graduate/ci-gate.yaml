
  # --- graduated · @@TAG@@ -----------------------------------------
  #
  # GENERATED by scripts/graduate.sh from @@CONVERSATIONS@@ distinct conversations.
  # The correction it enforces: @@SENTENCE@@
  #
@@ASSERTS@@
  #
  # GREP EXIT CODES ARE THE ASSERTION, AND THEY ARE INVERTED ON PURPOSE.
  #   1  nothing matched  -> pass. The property holds for every file examined.
  #   0  something matched -> fail. `-c` names the file and the count.
  #   2  grep could not read a file -> refused. UNMEASURED, never a clean zero:
  #      a file nobody could open is not a file that passed.
  # `-H -c` is what makes the coverage line honest — it prints `path:0` for a
  # clean file too, so every file grep actually opened appears in stdout and a
  # file it silently skipped does not. A pattern-only `grep -n` prints nothing
  # on a clean run, and a check whose clean run and whose did-not-run look
  # identical is the failure this whole stage exists to prevent.
  #
  # WHAT IT CANNOT DO. It is one POSIX ERE over file bytes, so it carries
  # neither check-stderr.sh-style structural exemptions nor an inline escape
  # marker. That is the price of P4: the gate must be argv-only and must not run
  # anything out of the repository it is gating, and `grep` is what is left.
  - id: graduated-@@TAG@@
    why: "@@WHY@@"
    when:
      paths:
@@PATHS@@
    severity: block
    requires: [grep]
    version_command: [grep, --version]
    mode: batch
    command: [grep, -H, -c, -E, "@@ERE@@", "{files}"]
    timeout_seconds: 60
    exit_codes:
      pass: [1]
      fail: [0]
      refused: [2]
    coverage:
      from: stdout_paths
      pattern: '^(\S+):[0-9]+$'
      must_cover: all_triggering
      min_covered: 1
