# .claude/productizer/checks.yaml — the checks stage, declared.
#
# Security and quality checks are a configured stage, not a list baked into the
# tool. This file is the whole declaration; `scripts/run-checks.sh` only obeys
# it. Adding, removing or re-scoping a check is a pull request against this
# file, reviewed like code.
#
# WHO OWNS IT. One named person accountable for the checks stage — a security
# or engineering manager. Not the agent, and not whoever is shipping today. An
# owner who can be persuaded to loosen a check mid-change is not a gate.
#
# DATA ONLY, NEVER A COMMAND LINE. Every `command` is an argv list, never a
# string. A string would be handed to a shell, and this file is committed, so
# anyone who can land a commit would then be choosing what executes on the
# machine of whoever pulls it. The runner refuses a string.
#
# THE ONE RULE THIS FILE EXISTS TO ENFORCE:
#
#     A CHECK THAT EXAMINED NOTHING IS A FAILURE, NOT A PASS.
#
# Every check declares what it must have covered. The runner measures what it
# actually covered and fails the check when the two disagree — whatever exit
# code the tool returned. A scanner that grades A while opening one file out of
# thirty-three is the failure being prevented; `references/checks.md` sets out
# that case in full.
#
# THE SECOND RULE, WHICH CLOSES THE HOLE IN THE FIRST:
#
#     THE DENOMINATOR COMES FROM THE SPEC, NOT FROM THE CHECK.
#
# `coverage` says what a check must have examined — and the check author writes
# it, so a check can shrink its own scope and still pass honestly. The unit list
# under `coverage.spec_units` is therefore measured against the requirements
# enumerated from `policy.spec`, not against anything in this file. Drop a unit
# from a check's list and it does not leave the denominator: it turns up as
# `Missing` and the run refuses.
#
# Every active requirement gets a row in the result, the covered ones included.
# A report that lists only the failures leaves the reader supplying their own
# denominator, which is the same mistake in a different place.
#
# TEAM-LEVEL SETTINGS ARE NOT LOCALLY OVERRIDABLE.
#
# A `checks.local.yaml` beside this file may say `timeout_seconds`, because a
# slow laptop is nobody else's business. Everything else here — severity, when,
# coverage, commands, every `policy` key — decides what gets examined and
# whether the run blocks, which is what everyone downstream reads out of
# `checks-result.json`. Those are honoured only from this committed file. A
# local copy supplying one is ignored, with a warning naming it on stderr.
#
# AND: a config in which every check is `enabled: false` is a load error, not
# a clean pass. A configuration with no active verification refuses to load
# rather than exit 0 having verified nothing.
#
# ---------------------------------------------------------------------------
# THIS IS A TEMPLATE. AN UNEDITED COPY CHECKS AN IMAGINARY REPO.
#
#   1. Delete the checks whose tools you do not run. A declared tool that is
#      not installed fails the run; it is never skipped.
#   2. Run it once and read the coverage line of every check. A scanner
#      reporting one file out of thirty-three has found you a bug in your
#      checks stage, not a green build.
#   3. Break each check on purpose — plant a fake key, add an unquoted
#      variable, pin a vulnerable dependency — and watch it go red before you
#      believe it. A check never observed failing is decoration.
#   4. Confirm the exit codes below against the builds of the tools you
#      actually have. They are the vendors' documented codes, not guesses
#      about yours, and an exit code this file does not describe is treated as
#      a failure rather than a pass.
# ---------------------------------------------------------------------------

version: 1

policy:
  # A change that triggers no check at all is not a passing change: it means
  # this file does not describe the repo. `refuse` says so out loud. `pass`
  # hides it, and is here only so a repo mid-adoption can opt in deliberately.
  empty_run: refuse

  # Where the machine-readable result lands. Stage 6 review reads this file;
  # it is the evidence that the checks stage ran and what it covered.
  #
  # This path — and every relative path in this file, including the tools named
  # in `requires` and `command` — resolves against the REPOSITORY ROOT, which
  # the runner takes from the git work tree holding this config, not from this
  # config's own directory. It prints the root it chose on every run; read that
  # line if a tool you know is installed reports as missing.
  output: .claude/productizer/checks-result.json

  # The coverage denominator, derived mechanically. Every ACTIVE requirement in
  # this file becomes one row in the result; a requirement marked superseded or
  # withdrawn is out of the denominator, because the spec says the behaviour is
  # no longer agreed. An unreadable spec, or one with no requirements in it, is
  # reported UNMEASURED and refuses — never as "0 units, all covered".
  spec: .claude/productizer/spec.md

  # `auto`     measure as soon as any check declares `coverage.spec_units`, and
  #            say plainly that nothing was measured while none does
  # `require`  always measure; a spec that cannot be read refuses the run
  # `"off"`    a committed, visible opt-out. QUOTE IT: YAML reads a bare `off`
  #            as the boolean false.
  spec_coverage: auto

defaults:
  timeout_seconds: 120
  mode: batch
  severity: block

checks:

  # --- 1 · secret scan ----------------------------------------------------
  #
  # Runs against every change, because a secret can be committed into any file
  # type — a fixture, a notebook, a README.
  #
  # Per-file invocation, deliberately. Batch mode would let the tool decide
  # which files it felt like opening and still exit 0; per-file mode makes the
  # runner watch each file be accepted or refused, so "it only looked at one of
  # them" becomes visible instead of green. It costs one process per file.
  - id: secret-scan
    why: a secret reaching the remote must be rotated; blocking the merge afterwards fixes nothing
    when:
      always: true
    severity: block
    requires: [gitleaks]
    version_command: [gitleaks, version]
    mode: per_file
    command: [gitleaks, detect, --no-git, --no-banner, --redact, --source, "{file}"]
    timeout_seconds: 300
    exit_codes:
      pass: [0]
      fail: [1]        # leaks found
      refused: [2]     # gitleaks could not run
    coverage:
      from: per_file_exit
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1

      # WHICH REQUIREMENTS THIS CHECK VERIFIES. Uncomment and point at ids that
      # exist in `policy.spec`; the runner refuses a claim against an id the
      # spec does not list as active, because a claim nobody can look up is not
      # coverage.
      #
      #   Covered  this check verifies the requirement       (evidence optional)
      #   Partial  part of it — say which part is missing
      #   n/a      vacuous by the spec itself — `reason` REQUIRED
      #
      # `Missing` is not claimable. It is what the runner concludes about a
      # unit nothing covered, which is the one verdict a check must not be able
      # to write about itself.
      #
      # A CLAIM IS NOT COVERAGE. Each claim is bound to this check's own result:
      # if the check is disabled, its tool is absent, it timed out, it failed or
      # it came back hollow, the claim is voided and the unit goes back to
      # Missing. A disabled, skipped or todo check covers nothing.
      #
      # spec_units:
      #   - {id: R31, verdict: Covered, evidence: "per-file gitleaks over the whole change"}
      #   - {id: R32, verdict: Partial, reason: "history is not scanned, only the working tree"}
      #   - {id: R33, verdict: n/a, reason: "concerns the deploy gate, which this stage does not run"}

  # --- 2 · shell linter ---------------------------------------------------
  #
  # Scoped by path. A change with no shell in it does not pay for this.
  - id: shell-lint
    why: an unquoted variable in a deploy script is a production incident, not a style nit
    when:
      paths:
        - "**/*.sh"
        - "**/*.bash"
    severity: block
    requires: [npx]
    version_command: [npx, --yes, shellcheck, --version]
    mode: per_file
    command: [npx, --yes, shellcheck, --severity=warning, --format=gcc, "{file}"]
    timeout_seconds: 300
    exit_codes:
      pass: [0]
      fail: [1]           # findings at or above the severity floor
      refused: [2, 3, 4]  # could not open, could not parse, bad invocation
    coverage:
      from: per_file_exit
      # 0 = clean, 1 = findings. Both mean the file was read. Anything else
      # means shellcheck bounced off it, and a file it bounced off is not a
      # file it checked.
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1

  # --- 3 · dependency audit ----------------------------------------------
  #
  # Triggered by the manifest and lockfile, and by a requirement tagged
  # `dependency` even when the diff touches no manifest — a requirement that
  # says "adopt library X" attracts the audit before the code exists.
  - id: dependency-audit
    why: a transitive advisory lands without anyone editing a file; the lockfile is the change
    when:
      paths:
        - "package.json"
        - "package-lock.json"
        - "**/package-lock.json"
      tags: [dependency, supply-chain]
    severity: block
    requires: [npm]
    version_command: [npm, --version]
    mode: batch
    # No {files}: npm audits the resolved tree, not a file list.
    command: [npm, audit, --audit-level=high, --json]
    timeout_seconds: 180
    exit_codes:
      pass: [0]
      fail: [1]
    coverage:
      # The audit's own count of what it resolved. A registry outage that
      # produces an empty tree exits 0 and looks identical to a clean audit —
      # this number is what tells them apart.
      from: stdout_count
      pattern: '"totalDependencies"\s*:\s*([0-9]+)'
      min_covered: 1

  # --- 4 · SAST, baseline -------------------------------------------------
  - id: sast
    why: the ordinary injection and path-traversal classes, on every change that touches code
    when:
      paths:
        - "**/*.py"
        - "**/*.js"
        - "**/*.ts"
        - "**/*.go"
    severity: block
    requires: [semgrep]
    version_command: [semgrep, --version]
    mode: batch
    command: [semgrep, --config, p/default, --json, --quiet, "{files}"]
    timeout_seconds: 600
    exit_codes:
      pass: [0]
      fail: [1]           # findings
      refused: [2, 4, 7]  # fatal error, invalid rule, every rule failed to load
    coverage:
      # Semgrep names each file it scanned in `paths.scanned`. Compare that
      # against the files this change actually touched: a parse failure makes
      # semgrep skip a file and still exit 0, which is a silent hole exactly
      # the shape of the one that motivated this whole stage.
      from: stdout_paths
      pattern: '"([^"]+\.(py|js|ts|go))"'
      must_cover: all_triggering
      min_covered: 1
      # A ruleset that failed to download is an empty ruleset, and an empty
      # ruleset always passes. Count the rules that actually loaded.
      min_rules: 50
      rules_command: [semgrep, --config, p/default, --dump-config, --json]
      rules_pattern: '"id"\s*:\s*"([^"]+)"'

  # --- 5 · SAST, authentication ------------------------------------------
  #
  # THE POINT OF PER-ITEM SCOPING. This check is not on the path list — it is
  # on the requirement tags. A requirement tagged `auth` attracts a stricter
  # ruleset, a longer timeout and a blocking verdict; a copy edit attracts
  # neither. The scoping follows what the change MEANS, which is recorded in
  # the living spec, not what it happens to touch.
  - id: sast-auth
    why: an authentication change earns more scrutiny than a copy edit, and the spec is where that is known
    when:
      tags: [auth, authn, authz, session, crypto, secrets]
    severity: block
    requires: [semgrep]
    version_command: [semgrep, --version]
    mode: batch
    command: [semgrep, --config, p/jwt, --config, p/secrets, --json, --quiet, "{files}"]
    timeout_seconds: 900
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2, 4, 7]
    coverage:
      from: stdout_paths
      pattern: '"([^"]+\.(py|js|ts|go))"'
      must_cover: all_triggering
      min_covered: 1
      min_rules: 10
      rules_command: [semgrep, --config, p/jwt, --config, p/secrets, --dump-config, --json]
      rules_pattern: '"id"\s*:\s*"([^"]+)"'

  # --- 6 · in-house script ------------------------------------------------
  #
  # Your own rule, held to the same contract as a vendor's: an argv list, a
  # version it can state, exit codes that separate a finding from a crash, and
  # a coverage assertion. `advise` because this one has a known false-positive
  # rate — it reports into the review brief and does not block the merge.
  #
  # Move it to `block` the week its findings stop being argued with. An
  # advisory check nobody ever promotes is a check nobody reads.
  - id: pii-log-scan
    # `enabled: false` takes a check out of force without deleting it: it is
    # reported as `disabled` rather than omitted, and every requirement it
    # claimed goes back to Missing. Switching every check off is a load error.
    enabled: true
    why: PII in a log line survives every retention policy the product promises
    when:
      paths:
        - "**/*.py"
        - "**/*.js"
        - "**/*.ts"
      tags: [pii, logging, privacy]
    severity: advise
    requires: [./scripts/check-pii-logging.sh]
    version_command: [./scripts/check-pii-logging.sh, --version]
    mode: per_file
    command: [./scripts/check-pii-logging.sh, "{file}"]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2]
    coverage:
      from: per_file_exit
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1

  # --- 7 · suppressed stderr ----------------------------------------------
  #
  # `2>/dev/null` makes an ERROR and a genuine NO-MATCH identical. Once they
  # are identical, the run is green either way — and a check that examined
  # nothing looks exactly like a check that found nothing, which is the failure
  # this whole file exists to refuse, arriving one level down inside the tools.
  # In the repo that ships this template it hid three real defects in one
  # session: a broken count, a false absence, and a check that examined
  # nothing.
  #
  # `advise` HERE IS NOT TIMIDITY. Run it once before you set `block`: a repo
  # of any age has more of these than anyone expects, and blocking on day one
  # turns the rollout into an argument about the rule instead of a list of the
  # debt. The count is printed on every run. Promote to `block` the day it
  # reaches zero — a number, not a judgement call.
  #
  # EXEMPTIONS, AND WHY THEY COST A SENTENCE EACH. There are legitimate uses.
  # `command -v x >/dev/null 2>&1` is an existence TEST whose answer is the
  # exit status, and it is exempt structurally with no entry. Everything else
  # states a reason, in one of two places:
  #
  #   INLINE, for code you own — `# stderr-ok: <reason>` on the offending line.
  #   ALLOWLIST, for code you do not — an `--allow` argument, right here in the
  #   committed config, reviewed in the same diff as the check that grants it.
  #
  # Both refuse (exit 2) when the reason is missing or under 12 characters, and
  # the allowlist also refuses a snippet that does not itself quote the
  # redirection — a snippet naming only the surrounding code would exempt that
  # whole line forever, including a suppression added to it next year. A check
  # that can be silenced without saying why is the thing this check prevents.
  #
  # `check-stderr.sh` ships with this skill under `skills/spec/scripts/`. Copy
  # it to `./scripts/` or point the paths below at the plugin; either way a
  # repo-local tool path needs `policy.allow_repo_local_tools: true`.
  - id: stderr-suppression
    why: an error and a genuine no-match are indistinguishable once stderr is discarded, and a hollow check then looks exactly like a clean one
    when:
      paths:
        - "**/*.sh"
        - "**/*.bash"
    severity: advise
    requires: [./scripts/check-stderr.sh]
    version_command: [./scripts/check-stderr.sh, --version]
    mode: per_file
    command:
      - ./scripts/check-stderr.sh
      # One entry per exemption. FILE::SNIPPET::REASON — the snippet is a
      # literal substring of the offending line and must contain the
      # redirection itself; the reason is a sentence someone can disagree with
      # in review. Delete these two examples; they describe another repo.
      - --allow
      - 'scripts/build-view.sh::2>/dev/null || :::the builder runs against a repo that may have no history, no tags and no remote, and every one of these lines already turns a failure into no data with || :'
      - --allow
      - 'scripts/run-checks.sh::$pid" 2>/dev/null::kill and wait address a pid this script started and owns, so the only stderr is ESRCH from a child that already exited'
      - "{file}"
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # suppressed stderr found
      refused: [2]     # unreadable file, or an exemption with no reason
    coverage:
      from: per_file_exit
      # 0 = clean, 1 = findings. Both mean the file was read. A 2 is a file it
      # bounced off or an exemption it would not honour, and neither is a file
      # it checked.
      examined_when_exit_in: [0, 1]
      must_cover: all_triggering
      min_covered: 1

  # --- 8 · one living spec per product ------------------------------------
  #
  # The declared-checks answer to "exactly one living spec per product". It
  # reads `product.spec_home` and `product.repos` out of config.json and asks
  # every repo one question: do you hold the spec file? Two answers of yes is a
  # failure — two allocators both handing out R42, two specs both believed, and
  # the divergence found later by whoever trusted the wrong one. Zero is also a
  # failure.
  #
  # UNREACHABLE IS NOT ABSENT. A repo the check cannot open exits 2 — refused,
  # distinct from both pass and fail — and is never counted as "no spec there".
  # Counting it as absent is precisely how a two-spec product reports as a
  # one-spec product: the second spec is in the repo nobody could reach.
  #
  # `always`, because this failure does not arrive in a diff. A repo joins the
  # product, or someone scaffolds a spec in the wrong place, and no file in
  # this repo changes.
  #
  # Multi-repo products need to tell it where the other checkouts are:
  # `--repo owner/name=../name` per repo, or `--remote` to ask the GitHub
  # contents API via `gh`. `--remote` is off by default because a check that
  # reaches the network is not deterministic, and a rate limit would read as an
  # outage rather than a verdict.
  - id: spec-home
    why: two repos both holding a living spec means two allocators both handing out R42, and nothing else in the lifecycle notices
    when:
      always: true
    severity: block
    requires: [./scripts/check-spec-home.sh]
    version_command: [./scripts/check-spec-home.sh, --version]
    mode: batch
    command: [./scripts/check-spec-home.sh, --config, .claude/productizer/config.json]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # too many specs, none, or not where the config says
      refused: [2]     # a repo out of reach, or a config that cannot be read
    coverage:
      # The check's own count of repos it actually REACHED. A run that reached
      # none prints 0 and fails coverage as well as exiting 2: a spec count
      # nobody could compute is not a spec count of zero.
      from: stdout_count
      pattern: 'repos reachable:\s*([0-9]+)'
      min_covered: 1

  # --- 9 · a control framework, wired to the same tags --------------------
  #
  # `when.tags` matches REQUIREMENT TAGS carried by the change — and a tag is
  # just a string, so a control id is a tag like any other. Tag a requirement
  # `A.8.28` in the living spec and this check fires on exactly the changes
  # that touch that control, and on nothing else. No second system, no
  # spreadsheet kept in parallel, no quarterly reconciliation between the two.
  #
  # QUOTE THE IDS. `A.8.28` is fine bare, but `42001-6.1.2` is not obviously a
  # string to a YAML parser and `8.28` would be read as a number. Quote them
  # all and stop thinking about it.
  #
  # WHAT THIS BUYS, EXACTLY: for the control ids you tag, a dated, per-change
  # record of which tool ran, at which version, over which files, and what it
  # covered. That is the evidence layer UNDER a management system. It is not
  # the management system. `references/checks.md` sets out the boundary in
  # full — read it before anyone writes "ISO 27001 compliant" on a slide.
  - id: secure-coding-controls
    why: a change touching a tagged control gets the control's own scan, on the change that touches it, with a dated record of what was covered
    when:
      tags:
        - "A.8.28"        # ISO/IEC 27001:2022 Annex A — secure coding
        - "A.8.26"        # application security requirements
        - "42001-6.1.3"   # ISO/IEC 42001 — AI risk treatment
    severity: block
    requires: [semgrep]
    version_command: [semgrep, --version]
    mode: batch
    command: [semgrep, --config, p/secure-defaults, --json, --quiet, "{files}"]
    timeout_seconds: 900
    exit_codes:
      pass: [0]
      fail: [1]
      refused: [2, 4, 7]
    coverage:
      from: stdout_paths
      pattern: '"([^"]+\.(py|js|ts|go))"'
      must_cover: all_triggering
      min_covered: 1
      min_rules: 10
      rules_command: [semgrep, --config, p/secure-defaults, --dump-config, --json]
      rules_pattern: '"id"\s*:\s*"([^"]+)"'
      # THE CLAIM IS NOT THE EVIDENCE. Naming the requirement the control is
      # tagged on ties this check's result to that requirement in the report;
      # if the check is disabled, its tool is missing, or it came back hollow,
      # the claim is voided and the requirement goes back to Missing.
      #
      # spec_units:
      #   - {id: R44, verdict: Covered, evidence: "p/secure-defaults over every file in the change"}

  # --- a halt that nobody was asked to answer --------------------------------
  #
  # R23 says the lifecycle shall stop and ask which wins. The acceptance row for
  # it asserted the STOP and not the ASK, and the two are not the same event:
  # the halt worked, no ruling was ever drafted, and the work stopped and stayed
  # stopped with nobody holding a question. This check observes the ask.
  #
  # It asserts the obligation, not the implementation. The cautionary case in
  # this repo is R18, whose row says `argv[0] validation` while the principle it
  # enforces requires the whole argv - a row that describes what the code does
  # can never fail.
  #
  # `always`, because the failure does not arrive in a diff. A contradiction is
  # raised in conversation and abandoned; no file changes, which is precisely
  # the problem.
  #
  # UNREADABLE IS NOT ABSENT. A rulings directory nobody can open exits 2, never
  # 0 - a directory nobody can open is exactly where an unasked question hides.
  - id: ruling-requested
    why: a contradiction that halted without a drafted ruling leaves nobody holding the question, and the spec shows nothing waiting
    when:
      always: true
    severity: block
    requires: [./plugins/productizer/skills/spec/scripts/check-ruling-requested.sh]
    version_command: [./plugins/productizer/skills/spec/scripts/check-ruling-requested.sh, --version]
    mode: batch
    command: [./plugins/productizer/skills/spec/scripts/check-ruling-requested.sh]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # a concern with no ruling, a ruling nothing cites, or a ruling still wearing the template
      refused: [2]     # the rulings directory or one of its files could not be read
    coverage:
      # Files the check actually opened, one per line. The spec is always one of
      # them, so a run that opened nothing is a bug rather than an empty repo.
      from: stdout_paths
      pattern: '^(\S+)$'
      min_covered: 1

  # --- agent templates carry frontmatter nothing reads ------------------------
  #
  # Declared checks covered all files (hygiene), `**/*.sh` and the solver corpus.
  # The agent templates carry YAML frontmatter that selects a model, a tool set
  # and a permission mode - and nothing validated it. A typo in a key name does
  # not fail loudly; it silently falls back to a default, so a template that
  # asked for a restricted tool set quietly gets the unrestricted one.
  #
  # `always`, because the failure does not arrive in a diff: a key stops being
  # honoured when the host changes, not when the template does.
  - id: template-frontmatter
    why: a mistyped frontmatter key does not fail, it falls back to a default, so a template that asked for a restricted tool set silently gets the unrestricted one
    when:
      always: true
    severity: block
    requires: [python3]
    version_command: [python3, ./plugins/productizer/skills/spec/scripts/check-frontmatter.py, --version]
    mode: batch
    command: [python3, ./plugins/productizer/skills/spec/scripts/check-frontmatter.py]
    timeout_seconds: 60
    exit_codes:
      pass: [0]
      fail: [1]        # frontmatter that will not do what it says
      refused: [2]     # bad invocation, or a template that could not be read
    coverage:
      # The check's own count of files it opened. A file nobody could read is
      # counted as could-not-run, never as a file that passed.
      from: stdout_count
      pattern: '([0-9]+) file\(s\) checked'
      min_covered: 1
