# What was not established. Kept in the file rather than only in the prose,
# because a reader who only ever parses this file must still meet it.
not_established:
  - Whether a general-purpose coding agent is an Annex III high-risk system.
    Article 6 and Annex III were read in full; neither settles it.
  - Whether the Commission's Article 6(5) guidelines - due no later than
    2 February 2026, with a list of practical high-risk and not-high-risk use
    cases - have been published. Not fetched; status unknown here.
  - ISO/IEC 42001 control text, and the control count. Not read.
  - The AICPA Trust Services Criteria as published by the AICPA. What was read
    is a third-party CDN copy of TSP section 100, red-lined edition.
  - Whether any mapping here would satisfy an assessor. Nobody has assessed
    them, which is why the verb is `evidences` and never `compliant`.
