  # --- SOC 2, AICPA Trust Services Criteria -------------------------------
  #
  # Criterion level only. Points of focus are not mapped - they are where the
  # 2022 redlining lands in the copy that was read.

  - framework: SOC 2 (AICPA TSP section 100)
    control_id: CC8.1
    control_title: Change management
    obligation: >-
      The entity authorizes, designs, develops or acquires, configures,
      documents, tests, approves, and implements changes to infrastructure, data,
      software, and procedures to meet its objectives.
    artifacts:
      - .claude/productizer/classifications/
      - .claude/productizer/rulings/
      - .claude/productizer/spec.md
      - .claude/productizer/checks.yaml
      - plugins/productizer/skills/spec/templates/publish-gate.sh
      - plugins/productizer/skills/spec/templates/production-gate.sh
    coverage: partial
    note: >-
      Read the verbs one at a time. Authorizes - an intent is classified against
      the whole spec and a contradiction stops until a person rules. Documents -
      change log, spec delta, classification record. Tests - the checks stage.
      Approves - the gate is a PreToolUse hook, so nothing reaches an audience or
      production without a person. Not covered - configures, acquires, and every
      change to infrastructure or to data.

  - framework: SOC 2 (AICPA TSP section 100)
    control_id: CC3.1
    control_title: Objectives specified with sufficient clarity
    obligation: >-
      COSO Principle 6: The entity specifies objectives with sufficient clarity
      to enable the identification and assessment of risks relating to
      objectives.
    artifacts:
      - .claude/productizer/spec.md
      - plugins/productizer/skills/spec/scripts/validate-spec.py
    coverage: partial
    note: >-
      Clarity is mechanised rather than asserted - five EARS patterns, one
      `shall` per requirement, a named system before the `shall`, and a linter
      that reports a second `shall` as a separate requirement. Risk
      identification and assessment against those objectives is not here.

  - framework: SOC 2 (AICPA TSP section 100)
    control_id: CC5.3
    control_title: Control activities deployed through policies and procedures
    obligation: >-
      COSO Principle 12: The entity deploys control activities through policies
      that establish what is expected and in procedures that put policies into
      action.
    artifacts:
      - .claude/productizer/constitution.md
      - .claude/productizer/checks.yaml
      - plugins/productizer/skills/spec/templates/publish-gate.sh
    coverage: partial
    note: >-
      The constitution is the policy tier and each principle carries a
      `Checked by` line, precisely because a principle nobody checks is a
      slogan. The procedures putting it into action are the checks stage and the
      gates. Scoped to this lifecycle's controls, not to the entity's.

  - framework: SOC 2 (AICPA TSP section 100)
    control_id: CC2.1
    control_title: Relevant, quality information supporting internal control
    obligation: >-
      COSO Principle 13: The entity obtains or generates and uses relevant,
      quality information to support the functioning of internal control.
    artifacts:
      - .claude/productizer/checks-result.json
      - plugins/productizer/skills/spec/scripts/build-view.sh
    coverage: partial
    note: >-
      The result file is evidence rather than a summary - argv, version, exit
      code, trigger, covered and not covered - so a reader can tell "the pass
      found nothing" from "the pass loaded no rules". The rendering vocabulary
      keeps four states apart: a number when a file was read, an em dash when it
      does not exist, `?` when it exists and could not be parsed, `n/a` when the
      question does not apply.

  - framework: SOC 2 (AICPA TSP section 100)
    control_id: CC4.1
    control_title: Evaluations that the components of internal control are present and functioning
    obligation: >-
      COSO Principle 16: The entity selects, develops, and performs ongoing
      and/or separate evaluations to ascertain whether the components of internal
      control are present and functioning.
    artifacts:
      - plugins/productizer/skills/spec/scripts/run-checks.sh
      - .claude/productizer/checks.yaml
    coverage: partial
    note: >-
      "Present and functioning" is the exact question these mechanisms answer - a
      check that could not run blocks whatever its severity, an absent declared
      tool is reported missing rather than skipped, and a check that exited zero
      having examined less than it declared is a failure. What is evaluated is
      this lifecycle's controls, not the entity's internal control as a whole.

  - framework: SOC 2 (AICPA TSP section 100)
    control_id: CC7.1
    control_title: Detection and monitoring for new vulnerabilities
    obligation: >-
      To meet its objectives, the entity uses detection and monitoring procedures
      to identify (1) changes to configurations that result in the introduction
      of new vulnerabilities, and (2) susceptibilities to newly discovered
      vulnerabilities.
    artifacts:
      - .claude/productizer/checks.yaml
      - plugins/productizer/skills/spec/scripts/run-checks.sh
    coverage: partial
    note: >-
      Productizer is the harness, not the detector. It declares which scanners
      run, refuses a change that triggered no check at all, and records what each
      one covered. The detection is the declared tool's, and the quality of the
      answer is the tool's quality.

