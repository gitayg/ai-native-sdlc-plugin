# compliance-map.yaml — the mappings in references/compliance-map.md, as data.
#
# DESCRIPTIVE, NOT EXECUTABLE. NOTHING READS THIS FILE.
#
# There is no runner, no check and no hook that opens it today. It exists so
# that the mapping can be rendered, diffed and counted by something other than a
# human reading a table, and so that a future coverage view has a source that is
# not prose. Do not cite it as a feature and do not write anything that implies
# a control derives from it.
#
# WHAT A ROW IS, AND WHAT IT IS NOT.
#
#     A ROW SAYS AN ARTIFACT EVIDENCES A CONTROL OBLIGATION.
#     IT NEVER SAYS THE CONTROL IS SATISFIED.
#
# `evidences` is the only verb this file supports. Satisfied, compliant and
# certified are an assessor's words and no row here is entitled to them.
#
# EVERY OBLIGATION IS VERBATIM, OR IT IS ABSENT.
#
# `obligation` holds the framework's own words, extracted from the primary
# document — never a paraphrase, never a summary, never a recollection. Where
# the text was shortened, the row says `abridged: true` and the elision is
# marked with an ellipsis in the text itself. Where the text could not be read
# at all, there is NO `obligation` key: the row carries `source` instead,
# naming who the title came from, and `coverage: unverified`. A row that
# invented a plausible obligation would be indistinguishable from a real one,
# which is the failure this shape exists to prevent.
#
# THE FOUR COVERAGE VALUES.
#
#   documented    the framework text says this, quoted, and a named artifact
#                 records what it asks for
#   partial       an artifact covers part of it. `note` says which part, and
#                 which part is left. A `partial` with a vague note is a
#                 `documented` in disguise
#   not-covered   Productizer produces nothing for this. `artifacts` is empty
#   unverified    the framework text has not been read. ISO/IEC 42001 only
#
# There is no value meaning "probably fine". A control nobody has an artifact
# for is `not-covered`, which is the same rule the checks stage applies to
# itself: a check that examined nothing is a failure, not a pass.
#
# THE NOT-COVERED ROWS ARE THE POINT. Do not prune them to make a summary look
# better. A map with the gaps removed is a marketing document, and the reason
# this file records the gaps as first-class rows — rather than as an absence of
# rows — is that an absent row and an unmapped obligation are indistinguishable
# to anything counting these.
#
# ---------------------------------------------------------------------------
# BEFORE EDITING: the prose is normative, this file follows it.
# `references/compliance-map.md` carries the caveats, the retrieval method for
# each framework, the applicability question for the EU AI Act, and the
# NOT-COVERED inventory in full. A row here without that context is a claim
# stripped of the reasons it is hedged.
# ---------------------------------------------------------------------------

version: 1

meta:
  reference: plugins/productizer/skills/spec/references/compliance-map.md
  compiled: 2026-09-02
  verb: evidences
  rows: 53
  by_coverage:
    documented: 3
    partial: 21
    not-covered: 20
    unverified: 9

# Where each framework's text was read from, and how. A row's `obligation` is
# only as good as the entry here.
sources:
  - framework: NIST AI RMF 1.0
    document: NIST AI 100-1
    url: https://nvlpubs.nist.gov/nistpubs/ai/NIST.AI.100-1.pdf
    method: pdftotext -layout; subcategory text read from Tables 1-4
    read: true

  - framework: NIST SSDF
    document: NIST SP 800-218 version 1.1
    url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-218.pdf
    method: pdftotext -layout; task column of Table 1 sliced by character offset
    read: true

  - framework: NIST SSDF GenAI Profile
    document: NIST SP 800-218A
    url: https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-218A.pdf
    method: pdftotext -layout; Scope
    read: true
    note: >-
      Quoted in the prose but mapped to no row. It declines to distinguish
      human-written from AI-generated source code, so no SSDF task asks who
      wrote the code and no artifact here can evidence an AI-authorship
      obligation.

  - framework: EU AI Act
    document: Regulation (EU) 2024/1689
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/HTML/?uri=OJ:L_202401689
    method: HTML tag-stripped; enacting articles and Annexes III and IV
    read: true

  - framework: EU AI Act, as amended
    document: Regulation (EU) 2026/1744 (Digital Omnibus on AI)
    url: https://eur-lex.europa.eu/eli/reg/2026/1744/oj/eng
    method: recorded in this repository's research notes; recital 40 and the Article 113 replacement
    read: true
    note: >-
      Moves Chapter III Sections 1-3 to 2 December 2027 (Article 6(2) and
      Annex III) and 2 August 2028 (Article 6(1)). Slipped, not cancelled.

  - framework: SOC 2
    document: AICPA TSP section 100, 2017 Trust Services Criteria (With Revised Points of Focus - 2022)
    url: null
    method: >-
      pdftotext -layout of a third-party CDN copy of the AICPA PDF, filename
      `92317096_trust_services_criteria_red-lined_version.pdf`. The URL is not
      recorded here: it is somebody's redistribution of a copyrighted document,
      not the publisher's.
    read: true
    note: >-
      The AICPA's own download page is gated and returns no PDF to a plain
      request. What was read is the primary document from a host that is not
      the publisher, in its red-lined edition. Criterion text was checked line
      by line for redline artefacts; points of focus, where most redlining
      lands, are not quoted or mapped.

  - framework: ISO/IEC 42001
    document: ISO/IEC 42001:2023
    url: null
    method: NOT READ - paywalled; iso.org returned HTTP 403 to a plain request
    read: false
    titles_from: https://www.isms.online/iso-42001/annex-a-controls/
    titles_retrieved: 2026-09-02
    note: >-
      Control titles only, from a named third party listing 38 controls under
      nine objectives A.2 to A.10. A second third-party listing checked the
      same day agrees on 38. Agreement between two paraphrases is not
      verification against the standard. No control text is quoted because none
      has been read.

mappings:

  # --- NIST AI RMF 1.0 ----------------------------------------------------
  #
  # The AI RMF governs the risk of an AI system. Productizer governs the
  # process by which software is built. Two different objects, which is why
  # not-covered outnumbers everything else here.

  - framework: NIST AI RMF 1.0
    control_id: MAP 1.6
    control_title: System requirements are elicited and understood
    obligation: >-
      System requirements (e.g., "the system shall respect the privacy of its
      users") are elicited from and understood by relevant AI actors. Design
      decisions take socio-technical implications into account to address AI
      risks.
    artifacts: [.claude/productizer/spec.md, .claude/productizer/classifications/]
    coverage: partial
    note: >-
      First sentence only. The living spec holds requirements in the same
      `shall` grammar the subcategory illustrates, with an EARS linter on the
      form and a classification record naming which ids were in scope. Nothing
      in the lifecycle reasons about socio-technical implications.

  - framework: NIST AI RMF 1.0
    control_id: GOVERN 1.2
    control_title: Trustworthy AI characteristics integrated into policy
    obligation: >-
      The characteristics of trustworthy AI are integrated into organizational
      policies, processes, procedures, and practices.
    artifacts: [.claude/productizer/constitution.md]
    coverage: partial
    note: >-
      The constitution is a policy tier above requirements, checked at intake
      before classification; an intent that crosses a principle is refused, not
      merged with a note. Productizer supplies no principles and refuses to
      seed invented ones, so it does not supply the characteristics.

  - framework: NIST AI RMF 1.0
    control_id: GOVERN 1.4
    control_title: Risk management process established through transparent controls
    obligation: >-
      The risk management process and its outcomes are established through
      transparent policies, procedures, and other controls based on
      organizational risk priorities.
    artifacts:
      - .claude/productizer/checks.yaml
      - .claude/productizer/checks-result.json
      - .claude/productizer/waivers/
    coverage: partial
    note: >-
      Transparent and reviewable is covered: which checks run, which block, and
      who accepted a failure are committed files that change by pull request.
      Organizational risk priorities are the team's to set and nothing here
      derives them.

  - framework: NIST AI RMF 1.0
    control_id: GOVERN 2.1
    control_title: Roles, responsibilities and lines of communication documented
    obligation: >-
      Roles and responsibilities and lines of communication related to mapping,
      measuring, and managing AI risks are documented and are clear to
      individuals and teams throughout the organization.
    artifacts:
      - .claude/productizer/checks.yaml
      - .claude/productizer/waivers/
      - .claude/productizer/rulings/
    coverage: partial
    note: >-
      Three named accountabilities enforced by shape - the checks stage has one
      owner outside the change's critical path, a waiver with no authority is
      malformed and softens nothing, and a requirement's author may not amend
      the constitution to unblock their own change. None of it documents an
      AI-risk role.

  - framework: NIST AI RMF 1.0
    control_id: MEASURE 1.1
    control_title: Measurement approaches selected; the unmeasurable documented
    obligation: >-
      Approaches and metrics for measurement of AI risks enumerated during the
      MAP function are selected for implementation starting with the most
      significant AI risks. The risks or trustworthiness characteristics that
      will not - or cannot - be measured are properly documented.
    artifacts:
      - plugins/productizer/skills/spec/references/measurement.md
      - .claude/productizer/checks-result.json
    coverage: partial
    note: >-
      Second sentence only, and answered directly - a value that could not be
      measured is never rendered as zero, each instrument prints a distinct
      word for why, and measurement.md names the plugin's own central
      unmeasured claim. The first sentence presupposes AI risks enumerated in
      MAP; Productizer enumerates none.

  - framework: NIST AI RMF 1.0
    control_id: MEASURE 2.13
    control_title: Effectiveness of TEVV metrics and processes evaluated
    obligation: >-
      Effectiveness of the employed TEVV metrics and processes in the MEASURE
      function are evaluated and documented.
    artifacts:
      - plugins/productizer/skills/spec/scripts/run-checks.sh
      - .claude/productizer/spec.md
    coverage: partial
    note: >-
      The mechanism matches and the object does not. A check exiting zero
      having examined less than it declared is hollow and fails, and every
      acceptance row records what its check was falsified against. That
      evaluates whether the verification verified anything - not an AI system's
      TEVV metrics.

  - framework: NIST AI RMF 1.0
    control_id: MANAGE 1.1
    control_title: Determination whether development or deployment should proceed
    obligation: >-
      A determination is made as to whether the AI system achieves its intended
      purposes and stated objectives and whether its development or deployment
      should proceed.
    artifacts: []
    coverage: not-covered
    note: >-
      The deploy gate is adjacent and is not this. It asks whether THIS CHANGE
      may proceed. It does not determine whether an AI system achieves its
      purposes.

  - framework: NIST AI RMF 1.0
    control_id: MAP 5.1
    control_title: Likelihood and magnitude of identified impacts
    obligation: >-
      Likelihood and magnitude of each identified impact (both potentially
      beneficial and harmful) based on expected use, past uses of AI systems in
      similar contexts, public incident reports, feedback from those external
      to the team that developed or deployed the AI system, or other data are
      identified and documented.
    artifacts: []
    coverage: not-covered
    note: No impact assessment of any kind.

  - framework: NIST AI RMF 1.0
    control_id: MEASURE 2.10
    control_title: Privacy risk examined and documented
    obligation: >-
      Privacy risk of the AI system - as identified in the MAP function - is
      examined and documented.
    artifacts: []
    coverage: not-covered
    note: ""

  - framework: NIST AI RMF 1.0
    control_id: MEASURE 2.11
    control_title: Fairness and bias evaluated
    obligation: >-
      Fairness and bias - as identified in the MAP function - are evaluated and
      results are documented.
    artifacts: []
    coverage: not-covered
    note: No bias testing. Nothing here is a substitute for one.

  - framework: NIST AI RMF 1.0
    control_id: MANAGE 4.1
    control_title: Post-deployment monitoring plans implemented
    obligation: >-
      Post-deployment AI system monitoring plans are implemented, including
      mechanisms for capturing and evaluating input from users and other
      relevant AI actors, appeal and override, decommissioning, incident
      response, recovery, and change management.
    artifacts: []
    coverage: not-covered
    note: >-
      Change management alone is partially covered under SOC 2 CC8.1. The rest
      of this subcategory is absent; the lifecycle stops at the deploy gate.

  - framework: NIST AI RMF 1.0
    control_id: MANAGE 4.3
    control_title: Incidents and errors communicated
    obligation: >-
      Incidents and errors are communicated to relevant AI actors, including
      affected communities. Processes for tracking, responding to, and
      recovering from incidents and errors are followed and documented.
    artifacts: []
    coverage: not-covered
    note: ""

  # --- NIST SSDF, SP 800-218 v1.1 -----------------------------------------
  #
  # The closest fit of the four frameworks, because its object is the same as
  # Productizer's: the process by which software is produced.

  - framework: NIST SSDF SP 800-218 v1.1
    control_id: PO.1.2
    control_title: Identify and document security requirements for organization-developed software
    obligation: >-
      Identify and document all security requirements for organization-developed
      software to meet, and maintain the requirements over time.
    artifacts: [.claude/productizer/spec.md]
    coverage: partial
    note: >-
      The spec is where they live and the id discipline maintains them - ids
      never reused or renumbered, a replaced requirement keeps its original
      sentence marked superseded, one living spec that is always current.
      "All" is load-bearing and nothing here establishes the set is complete.

  - framework: NIST SSDF SP 800-218 v1.1
    control_id: PO.3.3
    control_title: Configure tools to generate artifacts of their support of secure practices
    obligation: >-
      Configure tools to generate artifacts of their support of secure software
      development practices as defined by the organization.
    artifacts:
      - .claude/productizer/checks-result.json
      - plugins/productizer/skills/spec/scripts/req-trailer.sh
    coverage: documented
    note: >-
      The result file is generated by the runner rather than written by anyone -
      exact argv, tool version string, exit code, trigger, coverage. The commit
      trailer is the second artifact and is queryable with `git log --grep` on a
      machine that has never heard of this tooling.

  - framework: NIST SSDF SP 800-218 v1.1
    control_id: PO.4.1
    control_title: Define criteria for software security checks
    obligation: >-
      Define criteria for software security checks and track throughout the
      SDLC.
    artifacts: [.claude/productizer/checks.yaml]
    coverage: documented
    note: >-
      The whole declaration is one committed file - which checks exist, what
      triggers each, whether it blocks, what it must have covered, which
      requirement ids it claims. A config where every check is disabled is a
      load error, not a clean pass.

  - framework: NIST SSDF SP 800-218 v1.1
    control_id: PO.4.2
    control_title: Gather and safeguard information supporting the criteria
    obligation: >-
      Implement processes, mechanisms, etc. to gather and safeguard the
      necessary information in support of the criteria.
    artifacts:
      - .claude/productizer/checks-result.json
      - plugins/productizer/skills/spec/scripts/merge-checks-result.sh
    coverage: partial
    note: >-
      Gathering is covered: the runner writes the file on every run without
      anyone's help. Safeguarding is the weaker half and this row says so
      rather than claiming it. The result file is deliberately NOT committed -
      a generated measurement conflicts on every merge, and every ordinary
      conflict resolution writes a number nobody took - so the tree retains no
      history of past runs and retention is whatever the CI artifact store
      gives you. The merge driver that would re-measure rather than pick a
      side is shipped but inert until two `git config` lines are run.

  - framework: NIST SSDF SP 800-218 v1.1
    control_id: PW.1.2
    control_title: Track and maintain security requirements, risks and design decisions
    obligation: >-
      Track and maintain the software's security requirements, risks, and design
      decisions.
    artifacts: [.claude/productizer/spec.md, .claude/productizer/rulings/]
    coverage: partial
    note: >-
      Requirements and design decisions are covered fully, and a decision that
      ended a contradiction gets its own committed D-numbered file so the
      argument survives the session it was had in. Risks are covered only as far
      as an Areas of concern row goes: no risk register, no severity scale.

  - framework: NIST SSDF SP 800-218 v1.1
    control_id: PW.2.1
    control_title: Review the software design against the security requirements
    obligation: >-
      Have 1) a qualified person (or people) who are not involved with the
      design and/or 2) automated processes instantiated in the toolchain review
      the software design to confirm and enforce that it meets all of the
      security requirements and satisfactorily addresses the identified risk
      information.
    artifacts: [.claude/productizer/spec.md, .claude/productizer/checks.yaml]
    coverage: partial
    note: >-
      The second limb is instantiated - every active requirement must have a row
      naming the check that asserts it, and a requirement with no row fails the
      run. The declared limitation is the honest half: the check asserts a row
      EXISTS, never that the row is TRUE.

  - framework: NIST SSDF SP 800-218 v1.1
    control_id: PW.7.1
    control_title: Determine whether code review and/or code analysis should be used
    obligation: >-
      Determine whether code review (a person looks directly at the code to find
      issues) and/or code analysis (tools are used to find issues in code,
      either in a fully automated way or in conjunction with a person) should be
      used, as defined by the organization.
    artifacts:
      - .claude/productizer/checks.yaml
      - plugins/productizer/skills/spec/templates/REVIEW.md
    coverage: documented
    note: >-
      This determination is the checks stage's premise - configured, not baked
      in - and per-item scoping decides which checks a given change triggers.

  - framework: NIST SSDF SP 800-218 v1.1
    control_id: PW.7.2
    control_title: Perform the code review and/or code analysis and triage findings
    obligation: >-
      Perform the code review and/or code analysis based on the organization's
      secure coding standards, and record and triage all discovered issues and
      recommended remediations in the development team's workflow or issue
      tracking system.
    artifacts:
      - plugins/productizer/skills/spec/scripts/run-checks.sh
      - .claude/productizer/checks-result.json
    coverage: partial
    note: >-
      Performing and recording are covered, with the coverage assertion that
      makes a scanner which opened one file out of thirty-three visible instead
      of green. Triage into a workflow or issue tracker is not: the spec's scope
      section puts being a ticket tracker out of scope.

  - framework: NIST SSDF SP 800-218 v1.1
    control_id: PW.8.2
    control_title: Scope, design, perform and document security testing
    obligation: >-
      Scope the testing, design the tests, perform the testing, and document the
      results, including recording and triaging all discovered issues and
      recommended remediations in the development team's workflow or issue
      tracking system.
    artifacts: [.claude/productizer/checks.yaml, .claude/productizer/checks-result.json]
    coverage: partial
    note: Same split as PW.7.2, and the same reason.

  - framework: NIST SSDF SP 800-218 v1.1
    control_id: PS.1.1
    control_title: Store all forms of code under least privilege
    obligation: >-
      Store all forms of code - including source code, executable code, and
      configuration-as-code - based on the principle of least privilege so that
      only authorized personnel, tools, services, etc. have access.
    artifacts: []
    coverage: not-covered
    note: Access control over the repository belongs to its host, not to this plugin.

  - framework: NIST SSDF SP 800-218 v1.1
    control_id: PS.3.2
    control_title: Collect, safeguard, maintain and share provenance data
    obligation: >-
      Collect, safeguard, maintain, and share provenance data for all components
      of each software release (e.g., in a software bill of materials [SBOM]).
    artifacts: []
    coverage: not-covered
    note: >-
      No SBOM is produced. req-trailer.sh records a DIFFERENT provenance - which
      agreement a commit served, not which components a release contains - and
      the two must not be confused when answering a supply-chain question.

  - framework: NIST SSDF SP 800-218 v1.1
    control_id: RV.1.3
    control_title: Vulnerability disclosure and remediation policy
    obligation: >-
      Have a policy that addresses vulnerability disclosure and remediation, and
      implement the roles, responsibilities, and processes needed to support that
      policy.
    artifacts: []
    coverage: not-covered
    note: ""

  - framework: NIST SSDF SP 800-218 v1.1
    control_id: RV.3.4
    control_title: Review and update the SDLC process to prevent root-cause recurrence
    obligation: >-
      Review the SDLC process, and update it if appropriate to prevent (or
      reduce the likelihood of) the root cause recurring in updates to the
      software or in new software that is created.
    artifacts: [.claude/productizer/learnings/]
    coverage: partial
    note: >-
      The learnings store is a committed record of what was noticed, one file
      per learning so that "nobody has ever recorded one" and "there are none
      right now" stay distinguishable. It is not scoped to vulnerability root
      causes, and nothing forces a learning to change the process.

  # --- EU AI Act, Regulation (EU) 2024/1689 -------------------------------
  #
  # APPLICABILITY IS UNRESOLVED AND THE PROSE SAYS SO. Nearly every row below
  # binds providers of HIGH-RISK AI systems. A general-purpose coding agent is
  # not obviously in any Annex III area, and Article 6(3) carves out even an
  # Annex III system performing a narrow procedural task. Where these rows bite
  # is when the SOFTWARE BEING BUILT is itself high-risk - a question about the
  # product, not about the tool that built it. Nothing in this file decides it.

  - framework: EU AI Act (Regulation (EU) 2024/1689)
    control_id: Article 9(1)
    control_title: Risk management system
    obligation: >-
      A risk management system shall be established, implemented, documented and
      maintained in relation to high-risk AI systems.
    artifacts: []
    coverage: not-covered
    note: There is no risk management system here, continuous or otherwise.

  - framework: EU AI Act (Regulation (EU) 2024/1689)
    control_id: Article 10(2)
    control_title: Data and data governance
    obligation: >-
      Training, validation and testing data sets shall be subject to data
      governance and management practices appropriate for the intended purpose
      of the high-risk AI system.
    artifacts: []
    coverage: not-covered
    note: No data governance, no training-data lineage, no dataset documentation.

  - framework: EU AI Act (Regulation (EU) 2024/1689)
    control_id: Article 11(1) / Annex IV points 2(a) and 2(b)
    control_title: Technical documentation
    obligation: >-
      The technical documentation of a high-risk AI system shall be drawn up
      before that system is placed on the market or put into service and shall be
      kept up-to date. [...] It shall contain, at a minimum, the elements set out
      in Annex IV. Annex IV 2(a): the methods and steps performed for the
      development of the AI system, including, where relevant, recourse to
      pre-trained systems or tools provided by third parties and how those were
      used, integrated or modified by the provider. Annex IV 2(b), in part: the
      key design choices including the rationale and assumptions made.
    abridged: true
    artifacts:
      - .claude/productizer/spec.md
      - .claude/productizer/classifications/
      - plugins/productizer/skills/spec/scripts/req-trailer.sh
    coverage: partial
    note: >-
      Two Annex IV elements out of a long list. 2(a) is genuinely evidenced -
      the change log is one row per commit to the spec, each classification
      record carries the spec commit and hash it was made against, and the
      trailer joins a commit to the requirement it served. 2(b) is evidenced by
      the Design section and the Decision record. Every other Annex IV element,
      and all of point 1, is absent.

  - framework: EU AI Act (Regulation (EU) 2024/1689)
    control_id: Article 12(1)
    control_title: Record-keeping
    obligation: >-
      High-risk AI systems shall technically allow for the automatic recording of
      events (logs) over the lifetime of the system.
    artifacts: []
    coverage: not-covered
    note: >-
      The gate log records this lifecycle's own gate decisions. It is not a
      runtime log of an AI system's inferences and the two are not
      interchangeable.

  - framework: EU AI Act (Regulation (EU) 2024/1689)
    control_id: Article 14(1)
    control_title: Human oversight
    obligation: >-
      High-risk AI systems shall be designed and developed in such a way,
      including with appropriate human-machine interface tools, that they can be
      effectively overseen by natural persons during the period in which they are
      in use.
    artifacts: []
    coverage: not-covered
    note: >-
      The publish and deploy gates are human oversight of the BUILD, before an
      artefact reaches an audience. Article 14 is oversight of the deployed
      system while it runs - a different design problem with different failure
      modes.

  - framework: EU AI Act (Regulation (EU) 2024/1689)
    control_id: Article 17(1)(b)-(d)
    control_title: Quality management system - design control, quality assurance, test and validation
    obligation: >-
      (b) techniques, procedures and systematic actions to be used for the
      design, design control and design verification of the high-risk AI system;
      (c) techniques, procedures and systematic actions to be used for the
      development, quality control and quality assurance of the high-risk AI
      system; (d) examination, test and validation procedures to be carried out
      before, during and after the development of the high-risk AI system, and
      the frequency with which they have to be carried out.
    artifacts:
      - .claude/productizer/checks.yaml
      - .claude/productizer/spec.md
      - plugins/productizer/skills/spec/templates/publish-gate.sh
      - plugins/productizer/skills/spec/templates/production-gate.sh
    coverage: partial
    note: >-
      These three sub-points are the strongest EU fit: the checks stage is a
      written, committed, reviewed statement of which procedures run, when they
      trigger, and what must have been covered for a pass to count. Absent -
      17(1)(a) regulatory-compliance strategy, (f) data management, (g) the
      Article 9 risk management system, (h) post-market monitoring, (i)
      serious-incident reporting.

