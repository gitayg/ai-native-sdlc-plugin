<!doctype html><meta charset="utf-8"><title>output only</title>
<p>What a real view does: it offers the viewer a file and reads nothing back.
The guard mirrors the shipped page - the method is named in a truthiness test
before it is called, and a test is not a second declaration.</p>
<button id="dl" hidden>download the evidence</button>
<script>(function(){var b=document.getElementById("dl");if(!b||!window.claude||!window.claude.use)return;window.claude.use("downloads").then(function(d){if(!d)return;b.hidden=false;});}());</script>
