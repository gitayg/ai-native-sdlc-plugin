<!doctype html><meta charset="utf-8"><title>the request assembled inside an evaluator</title>
<p>Neither the evaluator nor the request it runs appears in these bytes. Every
fragment is split across a plus, so no contiguous run of characters spells
window.claude, or the property, or the name of the evaluator.</p>
<script>window["ev" + "al"]("window.cla" + "ude.u" + "se('artifact')");</script>
